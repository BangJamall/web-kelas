name: Deploy Next.js via Docker

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: 📥 Ambil Kode Terbaru dari GitHub
        uses: actions/checkout@v4

      - name: 🐳 Rebuild & Restart Docker Container
        # Karena runner berjalan sebagai 'runner-user', pastikan user tersebut 
        # sudah memiliki izin untuk menjalankan perintah docker tanpa sudo.
        run: |
          # 1. Hentikan container yang sedang berjalan
          docker-compose down
          
          # 2. Bangun ulang image Docker dengan kode terbaru
          # Mengirimkan secret dari GitHub ke Dockerfile (ARG)
          docker-compose build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
            
          # 3. Jalankan container baru di latar belakang (detached)
          docker-compose up -d
