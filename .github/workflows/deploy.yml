name: Deploy Binet via Docker

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: 📥 Ambil Kode Terbaru dari GitHub
        uses: actions/checkout@v4
        
      - name: 🐳 Rebuild & Restart Docker Container
        run: |
          rsync -av --exclude='.git' ./ /opt/bnet/
          cd /opt/bnet/
          
          docker-compose down
          
          # 1. Hapus image lama (opsional, tapi bagus untuk memastikan)
          docker image prune -a -f
          
          # 2. Tambahkan --no-cache agar Next.js dipaksa membaca variabel baru
          export $(grep -v '^#' .env | xargs) && \
          docker-compose build --no-cache \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            
          docker-compose up -d
